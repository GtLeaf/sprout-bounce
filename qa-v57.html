<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Happy Jump - 移动端验收</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #20252b; }
    iframe {
      display: block;
      border: 0;
      width: var(--qa-width);
      height: var(--qa-height);
      transform: scale(var(--qa-scale));
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <iframe id="phone" title="手机端游戏预览"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Math.max(280, Math.min(768, Number(params.get('w')) || 451));
    const height = Math.max(480, Math.min(1024, Number(params.get('h')) || 912));
    const scale = Math.min(1, 700 / height);
    document.documentElement.style.setProperty('--qa-width', `${width}px`);
    document.documentElement.style.setProperty('--qa-height', `${height}px`);
    document.documentElement.style.setProperty('--qa-scale', scale);
    const phone = document.querySelector('#phone');
    const version = params.get('v') || '88';
    const gameParams = new URLSearchParams({ v: version, qa: `${width}x${height}` });
    if (params.has('tutorial')) gameParams.set('tutorial', params.get('tutorial'));
    phone.src = `./?${gameParams}`;
    if (params.get('autostart') === '1') {
      phone.addEventListener('load', () => phone.contentDocument.querySelector('#start')?.click(), { once: true });
    }
  </script>
</body>
</html>
